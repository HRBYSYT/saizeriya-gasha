<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>サイゼリヤガチャ</title>
    <style>
        /* 背景色をサイゼリヤの緑色に変更 */
        body { 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            text-align: center; 
            background-color: #11a73b; 
            color: #333; 
            padding: 20px; 
            margin: 0;
        }
        
        /* 全体を囲む白いパネル */
        .container {
            background-color: #ffffff;
            max-width: 550px;
            margin: 0 auto;
            padding: 30px 20px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }

        /* ロゴ画像のスタイル */
        .logo {
            display: block;
            margin: 0 auto 10px auto; /* 中央寄せし、下のテキストとの隙間を少しあける */
            max-width: 175px; /* ロゴの大きさに合わせて調整可能です */
            width: 100%;
        }

        h1 { color: #e60012; font-size: 28px; margin-top: 0; margin-bottom: 20px; }
        
        /* 金額入力エリアのデザイン */
        .input-area {
            margin: 0 0 20px 0;
            font-size: 18px;
            font-weight: bold;
        }

        #targetAmount {
            font-size: 20px;
            padding: 5px 10px;
            width: 120px;
            text-align: right;
            border: 2px solid #ccc;
            border-radius: 8px;
            margin: 0 10px;
        }

        /* カテゴリー選択エリアのデザイン（縦並び） */
        .category-area {
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin: 0 auto 20px auto;
            text-align: left;
            max-width: 300px;
            height: 200px; 
            overflow-y: auto;
        }

        .category-area label {
            display: block; 
            margin-bottom: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .category-area input[type="checkbox"] {
            margin-right: 10px;
            transform: scale(1.2); 
        }

        .gacha-btn { 
            background-color: #e60012;
            color: white; 
            border: none; 
            padding: 15px 40px; 
            font-size: 20px; 
            font-weight: bold;
            border-radius: 30px; 
            cursor: pointer; 
            box-shadow: 0 4px 6px rgba(230,0,18,0.3); 
            transition: 0.2s; 
            width: 80%;
            max-width: 300px;
        }
        .gacha-btn:active { 
            transform: translateY(3px); 
            box-shadow: 0 1px 2px rgba(230,0,18,0.3); 
        }
        
        #result { 
            margin-top: 30px; 
            text-align: left; 
        }
        
        /* 1つのメニュー行のデザイン（全体を縦並びに） */
        .item { 
            display: flex; 
            flex-direction: column; 
            border-bottom: 1px dashed #ccc; 
            padding: 12px 0; 
            gap: 6px; 
        }
        
        /* 上段：IDと栄養素と更新ボタンの行 */
        .item-info {
            display: flex;
            align-items: center;
            gap: 6px; 
            width: 100%; 
        }

        /* 下段：メニュー名と値段の行 */
        .item-main {
            display: flex;
            justify-content: space-between; 
            align-items: flex-end;
            width: 100%;
        }

        /* 注文番号 */
        .item-id {
            background-color: #fff200; 
            color: #e60012; 
            border: 1px solid #ccc;
            padding: 2px 8px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            min-width: 35px;
            text-align: center;
        }

        /* 栄養素（カロリー・塩分） */
        .item-nut {
            font-size: 11px;
            color: #666;
            white-space: nowrap; 
        }

        /* メニュー名 */
        .item-name {
            font-weight: bold;
            font-size: 15px; /* デフォルトサイズ */
            padding-right: 10px;
            white-space: nowrap;  /* 改行しない */
            overflow: hidden;     /* はみ出た部分を一旦隠す（この後のJSでサイズ調整するため） */
            flex: 1;
            min-width: 0;
        }

        /* 値段 */
        .item-price {
            font-size: 16px;
            min-width: 50px;
            text-align: right;
            font-weight: bold;
            flex-shrink: 0; 
        }

        /* 更新ボタンのエリア */
        .swap-area {
            margin-left: auto; 
            display: flex;
            align-items: center;
        }

        /* 更新ボタン用のテキスト */
        .swap-text {
            font-size: 9px;
            color: #e60012;
            margin-right: 2px;
            white-space: nowrap; 
        }

        /* 更新ボタン (2419/2417用) */
        .swap-btn {
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            padding: 2px 4px;
            transition: background-color 0.2s;
        }
        .swap-btn:hover { background-color: #e0e0e0; }
        .swap-btn:active { background-color: #d0d0d0; transform: scale(0.95); }

        .total-box { 
            font-size: 24px; 
            font-weight: bold; 
            margin-top: 25px; 
            padding-top: 15px;
            border-top: 3px double #e60012;
            color: #e60012; 
            text-align: right;
        }

        .total-nut {
            font-size: 14px;
            color: #555;
            font-weight: normal;
            margin-bottom: 5px;
        }
    </style>
</head>

            { id: "4301", name: "トッピング半熟卵", price: 50, category: "トッピング", cal: 83, salt: 0.2 },
            { id: "4304", name: "トッピング野菜ソース", price: 100, category: "トッピング", cal: 132, salt: 0.5 },
            { id: "4307", name: "トッピング粉チーズ", price: 100, category: "トッピング", cal: 90, salt: 0.7 },

            // ドリンク
            { id: "5101", name: "セットドリンクバー", price: 200, category: "ドリンク", cal: 0, salt: 0 },

            // テイクアウト
            { id: "5305", name: "テイクアウト サイゼリヤドレッシング(500ml)", price: 500, category: "テイクアウト", cal: 2430, salt: 11.9 },
            { id: "5306", name: "テイクアウト エクストラ・バージン・オリーブオイル(500ml)", price: 1200, category: "テイクアウト", cal: 4050, salt: 0 }
        ];

        // 状態を保持するためのグローバル変数
        let globalSelectedItems = [];
        let globalTotalPrice = 0;
        let globalTargetAmount = 0;

        function runGacha() {
            const amountInput = document.getElementById('targetAmount');
            let targetAmount = parseInt(amountInput.value, 10);

            if (isNaN(targetAmount) || targetAmount < 0) {
                alert("正しい金額（0円以上）を入力してください！");
                return;
            }

            const checkedBoxes = document.querySelectorAll('.category-cb:checked');
            const selectedCategories = Array.from(checkedBoxes).map(cb => cb.value);

            if (selectedCategories.length === 0) {
                alert("カテゴリーを1つ以上選択してください！");
                return;
            }

            let remainingAmount = targetAmount;
            let selectedItems = [];

            // ★ ここで「2417(ラムのランプステーキ)」をガチャの抽選から除外する
            const filteredMenu = menu.filter(item => 
                selectedCategories.includes(item.category) && item.id !== "2417"
            );

            while (true) {
                const affordableItems = filteredMenu.filter(item => item.price <= remainingAmount);
                if (affordableItems.length === 0) break;

                const randomIndex = Math.floor(Math.random() * affordableItems.length);
                const selectedItem = affordableItems[randomIndex];

                selectedItems.push(selectedItem);
                remainingAmount -= selectedItem.price;
            }

            // IDの先頭4文字を基準にして昇順に並び替える
            selectedItems.sort((a, b) => {
                const idA = a.id.slice(0, 4);
                const idB = b.id.slice(0, 4);
                return idA.localeCompare(idB);
            });

            // グローバル変数に保存（ボタンを押した時の再描画用）
            globalSelectedItems = selectedItems;
            globalTotalPrice = targetAmount - remainingAmount;
            globalTargetAmount = targetAmount;

            displayResult();
        }

        // ★ メニューを入れ替える関数
        function swapItem(index) {
            const currentItem = globalSelectedItems[index];
            
            if (currentItem.id === "2419") {
                // ビーフステーキならラムに変更
                globalSelectedItems[index] = menu.find(m => m.id === "2417");
            } else if (currentItem.id === "2417") {
                // ラムならビーフステーキに変更
                globalSelectedItems[index] = menu.find(m => m.id === "2419");
            }
            
            // 入れ替えた後に再描画
            displayResult();
        }

        function displayResult() {
            const resultDiv = document.getElementById('result');
            
            let html = `<h3 style='margin-bottom: 10px; color: #11a73b;'>予算 ${globalTargetAmount}円 の結果</h3>`;
            let totalCal = 0;
            let totalSalt = 0;
            
            if (globalSelectedItems.length === 0) {
                html += `<p>設定金額内で選べるメニューがありませんでした。</p>`;
            } else {
                globalSelectedItems.forEach((item, index) => {
                    totalCal += item.cal || 0;
                    totalSalt += item.salt || 0;

                    const nutText = (item.cal > 0 || item.salt > 0) 
                        ? `${item.cal}kcal / ${item.salt.toFixed(1)}g` 
                        : `- kcal / - g`;

                    // 2419 または 2417 の場合のみ更新ボタンを追加
                    let swapBtnHtml = "";
                    if (item.id === "2419" || item.id === "2417") {
                        swapBtnHtml = `
                            <div class="swap-area">
                                <span class="swap-text">※メニューがない場合は更新→</span>
                                <button class="swap-btn" onclick="swapItem(${index})" title="別のお肉に変更">🔄</button>
                            </div>
                        `;
                    }

                    // HTMLの組み立て部分
                    html += `
                        <div class="item">
                            <div class="item-info">
                                <span class="item-id">${item.id}</span>
                                <span class="item-nut">${nutText}</span>
                                ${swapBtnHtml}
                            </div>
                            <div class="item-main">
                                <span class="item-name">${item.name}</span>
                                <span class="item-price">${item.price}円</span>
                            </div>
                        </div>
                    `;
                });
            }
            
            html += `<div class="total-box">
                        <div class="total-nut">総カロリー: ${totalCal} kcal / 総塩分: ${totalSalt.toFixed(1)} g</div>
                        合計: ${globalTotalPrice}円
                     </div>`;
            
            resultDiv.innerHTML = html;
            
            // 描画後に文字サイズを自動調整
            adjustFontSize();
        }

        // --- 文字サイズを自動で縮小する関数 ---
        function adjustFontSize() {
            const itemNames = document.querySelectorAll('.item-name');
            
            itemNames.forEach(el => {
                let fontSize = 15; // デフォルトのフォントサイズ
                el.style.fontSize = fontSize + 'px';
                
                // 表示領域(clientWidth)を超える場合、文字を少しずつ小さくする
                while (el.scrollWidth > el.clientWidth && fontSize > 9) { 
                    fontSize -= 0.5;
                    el.style.fontSize = fontSize + 'px';
                }
            });
        }
    </script>

</body>
